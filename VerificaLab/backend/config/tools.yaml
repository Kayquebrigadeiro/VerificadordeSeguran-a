- id: mikumikubeam
  name: MikuMikuBeam
  path: tools/mikumikubeam/cmd/mmb-cli
  language: go
  layer: L7
  requires_root: false
  description: >
    Cliente e servidor em Go para testes HTTP e TCP, incluindo conexões lentas.
    Também oferece interface web e métodos que usam proxies.
  when_to_use: >
    Somente para avaliar, em laboratório isolado e autorizado, comportamento
    HTTP/TCP contra o serviço descartável do VerificaLab. Não use proxies.
  example: "go run ./cmd/mmb-cli attack --method http-flood --target http://127.0.0.1:8477 --threads 1 --duration 1"
  risks:
    - "Métodos de carga podem degradar o serviço alvo mesmo com poucos clientes."
    - "Proxies e métodos de bypass podem envolver sistemas de terceiros; não os use."
  default_limits:
    duration_s: 5
    threads: 1
    rate_limit: low



- id: slowloris
  name: Slowloris
  path: tools/slowloris/slowloris.py
  language: python
  layer: L7
  requires_root: false
  description: >
    Mantém conexões HTTP abertas enviando cabeçalhos incompletos periodicamente.
    Pode consumir o pool de conexões de servidores web mesmo com pouco tráfego.
  when_to_use: >
    Somente para avaliar a resiliência do serviço descartável local; a execução
    só deve ser habilitada quando houver timeout e cancelamento garantidos.
  example: "python3 slowloris/slowloris.py --help"
  risks:
    - "O programa pode manter conexões abertas sem um limite de duração nativo."
    - "Poucas conexões podem tornar um serviço indisponível."
  default_limits:
    duration_s: 5
    threads: 1
    rate_limit: low
  max_limits:
    duration_s: 30
    threads: 50



- id: pyddos
  name: PyDDoS
  path: tools/pyddos/pyddos.py
  language: python
  layer: L4+L7
  requires_root: false
  description: >
    Script interativo com métodos HTTP, conexões lentas e SYN via sockets raw.
    A instalação e alguns métodos podem solicitar privilégios elevados.
  when_to_use: >
    Somente em laboratório local autorizado, após selecionar uma opção HTTP
    e confirmar que duração e número de threads podem ser limitados.
  example: "python3 pyddos/pyddos.py"
  risks:
    - "SYN usa sockets raw; privilégios elevados aumentam o impacto de erros."
    - "O menu interativo não aplica os limites do VerificaLab."
  default_limits:
    duration_s: 5
    threads: 1
    rate_limit: low
  max_limits:
    duration_s: 10
    threads: 20


