[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "verificalab"
version = "0.2.0"
description = "Plataforma local de testes controlados e investigação por evidências"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42,<48",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "textual>=0.80,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
verificalab = "verificalab.__main__:main"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["verificalab*"]
