name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Pre-download Go modules (mikumikubeam)
        run: |
          cd tools/mikumikubeam
          go mod download
          go build ./cmd/mmb-cli || echo "build warning (não fatal)"

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e 'VerificaLab[test]'

      - name: Run tests
        run: |
          cd VerificaLab/backend
          python -m pytest tests -o addopts='' -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for shell=True
        run: |
          if grep -rn "shell=True" backend/verificalab/; then
            echo "::error::shell=True encontrado no código"
            exit 1
          fi
          echo "OK: nenhum shell=True"
